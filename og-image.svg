<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <style>
      .d { font-family: Georgia, 'Times New Roman', serif; fill: #103E3B; }
      .s { font-family: 'Segoe UI', Arial, sans-serif; fill: #4C615D; }
      .k { font-family: 'Segoe UI', Arial, sans-serif; fill: #B07F1E; letter-spacing: 6px; }
    </style>
  </defs>
  <rect width="1200" height="630" fill="#F6F2E9"/>
  <!-- topographic contours -->
  <g fill="none" stroke="#B9DCD0" stroke-width="2" opacity="0.7">
    <ellipse cx="930" cy="315" rx="120" ry="112"/>
    <ellipse cx="930" cy="315" rx="200" ry="186"/>
    <ellipse cx="930" cy="315" rx="285" ry="266"/>
    <ellipse cx="930" cy="315" rx="380" ry="352"/>
  </g>
  <!-- compass -->
  <g transform="translate(930,315)">
    <circle r="150" fill="#F6F2E9"/>
    <circle r="150" fill="none" stroke="#103E3B" stroke-width="9"/>
    <circle r="134" fill="none" stroke="#B9DCD0" stroke-width="2"/>
    <path d="M0 -118 L13 0 L0 0 Z" fill="#D9A441"/>
    <path d="M0 -118 L-13 0 L0 0 Z" fill="#C08F2E"/>
    <path d="M0 118 L13 0 L0 0 Z" fill="#103E3B"/>
